<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240"
  viewBox="0 0 1280 240" role="img" aria-label="alimostafa.me">
<defs>
<style>
@font-face{font-family:'Cabinet Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900;font-style:normal}
text{font-family:'Satoshi',system-ui,sans-serif}
.display{font-family:'Cabinet Grotesk','Satoshi',sans-serif;font-weight:700}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-weight:600;letter-spacing:0.08em}
</style>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
</filter>
<filter id="pshadow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
</filter>
<clipPath id="pfp"><circle cx="100" cy="100" r="100"/></clipPath>
</defs>
<rect width="1280" height="240" fill="#161615"/>
<text class="display" x="640.0" y="196" font-size="214" letter-spacing="-9"
  fill="#f2f2f0" text-anchor="middle">alimostafa.me</text>
<rect width="1280" height="240" filter="url(#grain)" opacity="0.10"/>
</svg>