<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="200"
  viewBox="0 0 1280 200" role="img" aria-label="Tech stack">
<defs>
<style>
@font-face{font-family:'Satoshi';src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900;font-style:normal}
text{font-family:'Satoshi',system-ui,sans-serif}
.display{font-family:'Cabinet Grotesk','Satoshi',sans-serif;font-weight:700}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  font-weight:600;letter-spacing:0.08em}
</style>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
</filter>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="175%">
  <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
</filter>
<filter id="pshadow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
</filter>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
  <stop offset="0.45" stop-color="#fff" stop-opacity="0.04"/>
  <stop offset="1" stop-color="#fff" stop-opacity="0.02"/>
</linearGradient>
<clipPath id="pfp"><circle cx="100" cy="100" r="100"/></clipPath>
</defs>
<rect width="1280" height="200" fill="#0e0e0d"/>
